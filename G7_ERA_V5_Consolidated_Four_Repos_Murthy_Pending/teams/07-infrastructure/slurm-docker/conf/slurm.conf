ClusterName=v5lab
SlurmctldHost=controller
SlurmUser=slurm
AuthType=auth/munge
MpiDefault=none
SlurmctldPort=6817
SlurmdPort=6818
SlurmctldTimeout=120
SlurmdTimeout=120
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/dev/stdout
SlurmdLogFile=/dev/stdout
SlurmctldDebug=info
SlurmdDebug=info
ReturnToService=2
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU
TaskPlugin=task/none
ProctrackType=proctrack/linuxproc
JobAcctGatherType=jobacct_gather/none
# Test lab only: Docker Desktop is not a real systemd/cgroup compute host.
SlurmdParameters=config_overrides
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=dbd
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos
PriorityType=priority/multifactor
PriorityWeightQOS=10000
PriorityWeightFairshare=1000
PriorityWeightAge=100
PriorityDecayHalfLife=7-0
PreemptType=preempt/qos
PreemptMode=REQUEUE
JobRequeue=1
RequeueExit=75
RequeueExitHold=1
# CPU-only simulated nodes: NOT evidence for GRES GPU, cgroup isolation, EFA or NCCL.
NodeName=compute[1-2] CPUs=2 Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=512 State=UNKNOWN
PartitionName=cpu Nodes=compute[1-2] Default=YES MaxTime=00:10:00 State=UP OverSubscribe=NO
